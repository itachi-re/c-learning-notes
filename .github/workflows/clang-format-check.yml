name: Clang-Format Check

on:
  push:
    branches: [main]
    paths:
      - "**/*.c"
      - "**/*.h"
      - ".clang-format"
      - ".github/workflows/clang-format-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.c"
      - "**/*.h"
      - ".clang-format"
      - ".github/workflows/clang-format-check.yml"
  workflow_dispatch:

jobs:
  format-check:
    name: clang-format --dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          set -e
          bad_files=""
          while IFS= read -r -d '' file; do
            if ! clang-format --dry-run --Werror "$file" 2> /tmp/fmt_err.log; then
              echo "::error file=$file::Formatting does not match .clang-format"
              cat /tmp/fmt_err.log
              bad_files="$bad_files $file"
            fi
          done < <(find . -type f \( -name "*.c" -o -name "*.h" \) -print0)

          if [ -n "$bad_files" ]; then
            echo ""
            echo "The following files need formatting:"
            echo "$bad_files"
            echo ""
            echo "Run: clang-format -i <file> locally, then commit the result."
            exit 1
          fi
